<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Being Designs — Creative Studio for Branding, Photography &amp; Video</title>
    <meta
      name="description"
      content="Being Designs — one-stop creative studio for branding, product shoots, video editing, social media and packaging that helps brands stand out."
    />

    <!-- Replace https://YOUR-DOMAIN-HERE.com with the real deployed URL
         once the site goes live — canonical/OG/Twitter tags all reference
         it below. -->
    <link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f1f38" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Being Designs" />
    <meta
      property="og:title"
      content="Being Designs — Creative Studio for Branding, Photography & Video"
    />
    <meta
      property="og:description"
      content="One-stop creative studio for branding, product shoots, video editing, social media and packaging that helps brands stand out."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN-HERE.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN-HERE.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Being Designs — Creative Studio for Branding, Photography & Video"
    />
    <meta
      name="twitter:description"
      content="One-stop creative studio for branding, product shoots, video editing, social media and packaging that helps brands stand out."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN-HERE.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data (schema.org LocalBusiness). Update sameAs/telephone
         once real social and contact details exist. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Being Designs",
        "description": "One-stop creative studio for branding, product shoots, video editing, social media and packaging.",
        "url": "https://YOUR-DOMAIN-HERE.com/",
        "image": "https://YOUR-DOMAIN-HERE.com/og-image.png",
        "priceRange": "$$",
        "areaServed": "Worldwide",
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brand Identity" } },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Social Media Management" }
          },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Packaging Design" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Video Editing" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Motion Graphics" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Videography" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Product Photography" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
